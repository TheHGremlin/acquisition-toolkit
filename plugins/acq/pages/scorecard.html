<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acquisition Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: pipeline view (Fit x Joy map + ranked table) and a two-column deal editor (form left, live verdict right, sticky). */
:root{
  --bg:#F5F3F7; --panel:#FFFFFF; --ink:#25212C; --muted:#6C6577; --line:#E2DDE8; --line-strong:#CFC8D8;
  --accent:#9446B3; --accent-ink:#6E2E88; --accent-soft:#F2E7F7;
  --ok:#2C7A57; --ok-soft:#E3F2EA; --warn:#A86A12; --warn-soft:#FBF0DD; --bad:#B03445; --bad-soft:#FBE6E9;
  --info:#3D5F9E; --info-soft:#E6ECF7;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17151B; --panel:#211E27; --ink:#EEEAF3; --muted:#A39BAF; --line:#34303C; --line-strong:#4A4454;
  --accent:#C68BDF; --accent-ink:#DDB3EE; --accent-soft:#36283F;
  --ok:#5DBE8E; --ok-soft:#1F3329; --warn:#E3AA52; --warn-soft:#3A2D18; --bad:#E86B7C; --bad-soft:#3D2027;
  --info:#8FAEE6; --info-soft:#232C3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17151B; --panel:#211E27; --ink:#EEEAF3; --muted:#A39BAF; --line:#34303C; --line-strong:#4A4454;
  --accent:#C68BDF; --accent-ink:#DDB3EE; --accent-soft:#36283F;
  --ok:#5DBE8E; --ok-soft:#1F3329; --warn:#E3AA52; --warn-soft:#3A2D18; --bad:#E86B7C; --bad-soft:#3D2027;
  --info:#8FAEE6; --info-soft:#232C3E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(20px,3vw,26px)}
h2{font-size:15px}
h3{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.primary{color:#1b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#1b1220}}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--bad)}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{resize:vertical;min-height:70px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink);font-weight:400;font-size:14px}
label.check input{margin-top:3px;accent-color:var(--accent)}
a{color:var(--accent-ink)}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.go{background:var(--ok-soft);color:var(--ok)}
.chip.shoes{background:var(--info-soft);color:var(--info)}
.chip.siren{background:var(--accent-soft);color:var(--accent-ink)}
.chip.pass{background:var(--bad-soft);color:var(--bad)}
.chip.out{background:var(--bad);color:#fff}
.chip.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.trust-High{background:var(--ok-soft);color:var(--ok)}
.chip.trust-Medium{background:var(--warn-soft);color:var(--warn)}
.chip.trust-Low{background:var(--bad-soft);color:var(--bad)}
/* pipeline */
.pipe{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.map svg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.map>summary{list-style:none;cursor:pointer}
.map>summary::-webkit-details-marker{display:none}
.map>summary h2::before{content:"▸ ";color:var(--muted)}
.map[open]>summary h2::before{content:"▾ "}
.map[open]>summary{margin-bottom:8px}
.map text{font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row.dim td{opacity:.55}
td.fit{font-family:var(--f-mono);font-weight:500;font-size:15px}
.empty{text-align:center;padding:34px 18px}
.empty p{max-width:46ch;margin:8px auto 16px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:980px){.editor{grid-template-columns:1fr}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
@media (max-width:980px){.side{position:static}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head .hint{font-size:12px;color:var(--muted)}
.crit{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.crit:first-of-type{border-top:0;padding-top:0}
.crit-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.crit-name{font-weight:600}
.wts{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-width:40px;padding:6px 0;font-family:var(--f-mono);font-weight:500}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#1b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#1b1220}}
.seg button.q.on{background:var(--muted);border-color:var(--muted)}
.seg.text button{min-width:0;padding:6px 10px;font-family:var(--f-body)}
.anchors{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.anchors li{padding-left:22px;position:relative}
.anchors li b{position:absolute;left:0;font-family:var(--f-mono);font-weight:500}
.anchors li.on{color:var(--ink)}
.readout{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.readout b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.scorebadge{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
.scorebadge.q{background:var(--bg);color:var(--muted);border:1px dashed var(--line-strong)}
.gate{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.gate .t{color:var(--warn);font-weight:600;font-size:14px}
.gate.hard{background:var(--bad-soft)}
.gate.hard .t{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border-radius:999px;padding:4px 10px;font-size:13px;border:1px solid var(--line-strong);background:var(--panel)}
.tag.on.pos{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tag.on.neg{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1}
.big small{font-size:14px;color:var(--muted);font-family:var(--f-body);font-weight:500}
.bars{display:flex;flex-direction:column;gap:4px;font-size:12px}
.bar-row{display:grid;grid-template-columns:118px 1fr 44px;gap:8px;align-items:center}
.bar-track{position:relative;height:10px;background:var(--bg);border-radius:4px}
.bar-track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-strong)}
.bar-fill{position:absolute;top:0;bottom:0;border-radius:3px}
.bar-fill.pos{left:50%;background:var(--ok)}
.bar-fill.neg{right:50%;background:var(--bad)}
.callouts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.callouts li{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg);border-left:3px solid var(--accent)}
.callouts li.bad{border-left-color:var(--bad)}
.callouts li.warn{border-left-color:var(--warn)}
.callouts li.ok{border-left-color:var(--ok)}
.qlist{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.review{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:8px;padding:10px 12px;max-height:420px;overflow:auto}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.saved{font-size:12px;color:var(--muted)}
.perkline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.perkline input{flex:1 1 160px}
.perkline select{width:auto}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.mult-table input{padding:5px 8px}
/* cheat sheet */
.cheat{display:flex;flex-direction:column;gap:14px;max-width:980px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
.try{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.try label{width:180px}
#nav-cheat.on,#nav-settings.on{color:var(--accent-ink)}
#nav-setup.on{color:var(--accent-ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.steps button{font-size:13px;padding:5px 10px}
.steps button.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.choices.deal{grid-template-columns:repeat(3,1fr)}
.choices.deal button{color:var(--bad);font-size:13px}
@media (max-width:560px){.choices{grid-template-columns:1fr 1fr}.choices.deal{grid-template-columns:1fr}}
.progress{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--accent)}
details.crit>summary{font-weight:600}
.io{display:flex;flex-direction:column;gap:8px}
.io textarea{font-family:var(--f-mono);font-size:12px;min-height:160px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="topbar">
    <div>
      <div class="eyebrow">Fit × Joy · first-look screener</div>
      <h1>Acquisition Scorecard</h1>
    </div>
    <div class="actions">
      <button id="nav-pipe" class="ghost" type="button">Pipeline</button>
      <button id="nav-cheat" class="ghost" type="button">Cheat sheet</button>
      <button id="nav-settings" class="ghost" type="button">Settings</button>
      <button id="nav-setup" class="ghost" type="button">Setup</button>
      <button id="new-deal" class="primary" type="button">+ New deal</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<!-- Copies of plugins/acq/templates/*.json. Edit those files, then run tools/dev/sync_templates.py. -->
<script type="application/json" id="lib-criteria">{"about":"Criteria you can add to your Scorecard. 'calc' criteria are scored by the Scorecard from inputs; 'judgment' criteria you score 1-5 against anchors you can rewrite. Anchor 1 = the worst you'd still accept (anything worse belongs in a gate), 5 = the best you could realistically find, 3 = solidly OK. 'starter: true' marks the ten-criterion starter set.","criteria":[{"id":"predictability","name":"Revenue predictability","kind":"judgment","starter":true,"group":"Stability","hint":"How steady the revenue stream is, not whether each customer returns. A steady flow of one-off buyers counts.","anchors":{"1":"Lumpy: a few big-ticket, discretionary sales or projects make or break the month.","2":"A meaningful share of revenue comes from big-ticket items or projects.","3":"A steady flow of everyday, low-ticket, high-volume purchases.","4":"A strong base of repeat customers, plus some contracts or memberships.","5":"Mostly contracts, memberships, subscriptions or a documented base of regulars."},"brokerQ":"What share of revenue is recurring (contracts, memberships, regulars)? Can I see monthly revenue for the last 24 months?","clues":"\"recurring\", \"membership\", \"contracts\", \"repeat customers\", average ticket size, transaction counts"},{"id":"seasonality","name":"Tourism & seasonality","kind":"judgment","starter":true,"group":"Stability","hint":"Would a bad tourist season or a slow quarter hurt? Think about your region's own seasons and weather.","anchors":{"1":"Mostly visitor-driven, or about 40%+ of revenue lands in one season.","2":"Mostly local, but a big seasonal swing (one season ~30-40% of revenue) or ~30-40% visitors.","3":"Mostly local with a noticeable seasonal swing, or roughly 20-30% visitors.","4":"Local, with a mild seasonal bump (e.g. holidays) and few visitors.","5":"Local, needs-based customers. Flat all year."},"brokerQ":"Monthly revenue for the last 2-3 years? Roughly what share of customers are visitors rather than locals?"},{"id":"track","name":"Track record","kind":"calc","calc":"trackRecord","starter":true,"group":"Stability","hint":"Calculated from years open and the revenue trend. Declining revenue is handled by a gate, not here.","anchors":{"1":"Young (under the first year band), revenue flat.","3":"Middle of the year bands, revenue flat.","5":"Long history (top year band), steady or growing."},"brokerQ":"What year was the business founded? Revenue and SDE for each of the last 3 years?"},{"id":"team","name":"Team in place","kind":"judgment","starter":true,"group":"Transferability","hint":"Who does the work when you're not there?","anchors":{"1":"Owner plus about one part-timer. The owner is the labor.","2":"A few staff, but the owner works most shifts and runs everything.","3":"Staff do most of the work; the owner is the glue. No formal manager.","4":"A lead or assistant manager handles daily operations; the owner fills gaps and does admin.","5":"A manager runs day-to-day with trained staff. The owner only oversees."},"brokerQ":"Who runs day-to-day? Staff count, roles and tenure. Is there a manager?"},{"id":"ownerDep","name":"Owner dependence","kind":"judgment","starter":true,"group":"Transferability","hint":"Would the regulars miss the old owner more than the business? (If the owner IS the product, that's a gate.)","anchors":{"1":"Many customers come for the owner, who holds most key customer and supplier relationships.","2":"Several key customers or suppliers deal only with the owner.","3":"The owner is a face of the business, but key relationships are shared.","4":"The owner is known, but staff handle most relationships; few customers would follow the owner out.","5":"Customers buy the brand. Staff hold the relationships."},"brokerQ":"Which customer and supplier relationships are personal to the owner? How many hours does the owner work, doing what?"},{"id":"transition","name":"Transition support","kind":"judgment","starter":true,"group":"Transferability","hint":"Often a tiebreaker. A low weight means tiebreaker, not irrelevant.","anchors":{"1":"Seller gone at close, nothing documented.","2":"A week or so of handover, little written down, staff new or few.","3":"2-4 weeks of training, plus some documentation or long-tenured staff.","4":"Seller offers 1-6 months of help, and key processes are written down.","5":"Seller stays 6-12 months to train or consult, and processes are written down."},"brokerQ":"Will the seller stay on to train or consult, and for how long? What's documented?"},{"id":"dealMath","name":"Deal math","kind":"calc","calc":"dealMath","starter":true,"group":"Financials","hint":"Calculated: the lower of your take-home band and your loan-coverage (DSCR) band at the asking price.","anchors":{"1":"Pays you your minimum salary or less; loan payments barely fit, or don't.","3":"Comfortable take-home and a reasonable safety margin on the loan.","5":"Pays well above what you need, with loan payments that fit with room to spare."},"brokerQ":"SDE (or EBITDA plus total owner pay) for the last 3 years, with add-backs itemized?"},{"id":"upside","name":"Operator upside","kind":"judgment","starter":true,"group":"Upside","hint":"Usually '?' from a listing. Count only gaps you can see evidence of; broker-promised 'growth potential' earns nothing.","anchors":{"1":"Already well run and modern. Little for you to add (not bad if you want passive income).","2":"Mostly well run; a gap or two to tidy up, but no real lever.","3":"Room to modernize some things; decently run.","4":"Clear gaps in one or two areas you know well (e.g. no online sales, manual scheduling).","5":"Specific, visible gaps right in your wheelhouse that plausibly raise earnings when fixed."},"brokerQ":"What would the owner change with more time or money? What systems run the business today (POS, booking, books)?"},{"id":"commute","name":"Commute burden","kind":"calc","calc":"commute","starter":true,"group":"Location","hint":"Calculated from one-way drive time and how often you'd need to be there.","anchors":{"1":"At the edge of your limit for how often you'd need to be there.","3":"Partway between close to home and your limit.","5":"Close to home, or rarely needed on site."},"brokerQ":"Where exactly is the business located? How often does the owner actually need to be on site?"},{"id":"premises","name":"Premises","kind":"calc","calc":"premises","starter":true,"group":"Premises","hint":"Calculated: lease security x how much the business depends on its location.","anchors":{"1":"A storefront that depends on its spot, with under 5 years left and no right to renew.","3":"A location-dependent business with 5-10 years left including options.","5":"Owned, a long lease with options, or a business that could easily move."},"brokerQ":"Lease term remaining, renewal options, current rent, and will the landlord assign it or sign a new lease?"},{"id":"concentration","name":"Customer concentration","kind":"judgment","group":"Stability","hint":"Rarely visible in a listing; expect '?' until you see documents. Consider leaving it for the documents stage.","anchors":{"1":"One customer is about a third of revenue, or the top three are more than half.","3":"The largest customer is 10-15% of revenue; the rest are spread out.","5":"No customer is more than a few percent of revenue."},"brokerQ":"What share of revenue comes from the top 1, 3 and 10 customers? Any of them under contract?"},{"id":"licensing","name":"License & permit transfer","kind":"judgment","group":"Transferability","hint":"Who holds the licenses, permits or qualifier the business runs on, and do they transfer?","anchors":{"1":"The business runs on a license only the seller holds, with no clear path to transfer or replace it.","3":"Licenses can be re-issued to a new owner or held by an employee, with some paperwork and lead time.","5":"No special licensing, or licenses that transfer with the business as a matter of course."},"brokerQ":"Which licenses, permits or qualifiers does the business operate under, who holds each, and do they transfer?"},{"id":"reputation","name":"Reputation & online presence","kind":"judgment","group":"Upside","hint":"Five minutes on review sites and the business's own website.","anchors":{"1":"Poor or thin reviews, no usable website or listings.","3":"Decent reviews and a basic web presence.","5":"Strong, recent reviews; a brand people search for by name."},"brokerQ":"Does the business own its domain, social accounts and review profiles, and do they transfer with the sale?"},{"id":"capex","name":"Capital needs","kind":"judgment","group":"Financials","hint":"How much money the business will need for equipment, vehicles or build-out in the first few years.","anchors":{"1":"Major equipment, vehicles or build-out due soon, at a cost that eats a year of earnings or more.","3":"Normal ongoing replacement; nothing big due.","5":"Little equipment, or recent major upgrades already done."},"brokerQ":"Age and condition of major equipment and vehicles? Any big replacements or repairs expected in the next 3 years?"},{"id":"competition","name":"Competitive position","kind":"judgment","group":"Stability","hint":"Could a new competitor or a big chain take the customers? Judge from evidence, not the broker's adjectives.","anchors":{"1":"Crowded market, easy to copy, competing mostly on price.","3":"Some competition, with a reason customers choose this one (location, service, niche).","5":"A defensible niche, contracts or switching costs that keep customers."},"brokerQ":"Who are the main competitors, and why do customers choose this business over them?"},{"id":"staffTenure","name":"Staff stability","kind":"judgment","group":"Transferability","hint":"Turnover and how hard the key roles would be to replace.","anchors":{"1":"High turnover, or key staff likely to leave with the owner.","3":"Mixed tenure; a couple of long-time staff.","5":"Long-tenured staff in the key roles, with pay at or above market."},"brokerQ":"Staff list with roles, tenure and pay? Are any key employees planning to leave, or related to the owner?"}],"excludedOnPurpose":[{"name":"Growth potential / expansion path","why":"Buyers with a bigger vision tend to overpay for deal #1 because of what it could become. The first deal has to stand on its own numbers, so growth plans raise Joy (the 'plan' row), never Fit."},{"name":"Price vs. typical industry multiple","why":"Deal math already depends on the asking price, so scoring it twice double-counts. The Scorecard shows 'priced rich' / 'priced lean' flags instead."}]}</script>

and it costs more than your cash","tier":"soft","enabled":true,"explain":"The seller won't take bank financing and the total project is more than your cash down.","brokerQ":"Would the seller accept an SBA buyer or carry a note, or come down on price?"},{"id":"commute","label":"Past your commute limit","tier":"soft","enabled":true,"explain":"One-way drive longer than your limit for how often you'd need to be there.","brokerQ":"How often does the owner actually need to be on site?"},{"id":"landLease","label":"Land lease","tier":"soft","enabled":true,"explain":"The business owns the building but leases the ground under it.","brokerQ":"Land lease terms: years remaining, rent escalations, renewal rights?"},{"id":"turnaround","label":"Turnaround with a non-operational problem","tier":"soft","enabled":true,"explain":"The business is in trouble for reasons operations can't fix: a dying market, legal or regulatory trouble, a lost anchor contract.","brokerQ":"What's driving the problem, and what has the owner already tried?"}],"templates":[{"id":"food","label":"Food service","tier":"hard","explain":"Any business that needs licensing for fresh or unpackaged food. A shop selling only packaged goods passes.","digestRule":"Restaurants, cafes, bakeries, food trucks, caterers, and shops with a deli or hot-food counter."},{"id":"trade","label":"The owner role needs hands-on trade knowledge","tier":"hard","explain":"Test: would you need to know the trade to run it? A trade business with its technicians in place, where the gap is operations, passes.","digestRule":"Gate only when the owner must personally hold or perform the licensed trade work."},{"id":"region","label":"Outside my region","tier":"hard","needsText":"region","explain":"Outside the area you set in Geography (a state, a metro, a country). A remote business you can run from home passes.","digestRule":"Gate only when the operation physically sits outside the region and needs presence there."},{"id":"ownerProduct","label":"The owner is the product","tier":"hard","explain":"Nothing transferable: a personal brand, an artist's own work, a solo practitioner's practice with no other providers.","digestRule":"Solo practitioner or personal-brand businesses with no other providers."},{"id":"foreignOps","label":"Operations outside my country","tier":"hard","explain":"For online businesses: where the operations are, not just where the company is registered. US SBA loans generally need a US business ⚑ verify.","digestRule":"Skip online businesses whose operations are abroad. If the listing doesn't say, load it with a flag."},{"id":"route","label":"Route businesses","tier":"digest-only","explain":"Distributor, delivery, vending or service routes sold as a fixed circuit of stops.","digestRule":"The title or description calls it a route, or what's being bought is a fixed circuit of stops worked by a driver. A multi-crew service company that schedules in routes loads with a flag."},{"id":"fintech","label":"Fintech","tier":"digest-only","explain":"Businesses whose product is moving, lending, holding or trading money. Money-adjacent services (tax prep, bookkeeping, insurance agencies) pass.","digestRule":"Payment processing, merchant services, lending, crypto or trading tools, money transmitters, check cashing."},{"id":"franchise","label":"Franchise resale","tier":"soft","explain":"You'd be buying into a franchisor's rules, fees and approval process.","brokerQ":"Franchise fees and royalties, years left on the agreement, and the franchisor's transfer requirements?","digestRule":"Listings described as a franchise resale. Franchise ads in alert emails are not listings."},{"id":"healthLicensed","label":"Licensed health care","tier":"hard","explain":"Clinics and practices that need licensed providers and insurance billing.","digestRule":"Medical, dental, therapy or pharmacy businesses that bill insurance or need licensed providers."},{"id":"vice","label":"Industries I won't own","tier":"hard","needsText":"l <script>
(function(){
"use strict";

/* ---------- libraries and profile ---------- */
// The searcher's preferences live in one profile document (config/profile; see docs/CONFIG.md).
// Until they run Setup or import a config, the page runs on the fictional example profile.
const readJSON=id=>{try{return JSON.parse(document.getElementById(id).textContent);}catch(e){return {};}};
const LIB=readJSON("lib-criteria"), GATE_LIB=readJSON("lib-gates"), EXAMPLE=readJSON("lib-example");
const LIBC={};for(const c of LIB.criteria||[])LIBC[c.id]=c;
const BUILTIN={};for(const g of GATE_LIB.builtin||[])BUILTIN[g.id]=g;
const CALC_IDS=["dealMath","track","commute","premises"];
const PLAN_ANCHORS={1:"The bigger plan is dull, or this business barely connects to it.",2:"Meh plan. The only appeal is the money down the road.",3:"A pleasant plan, and this is a sensible first piece of it.",4:"A genuinely interesting plan, and this business is a natural first piece.",5:"A plan you'd be excited to build, and this is clearly the right first piece."};
const QUAD={go:"Go look",shoes:"Sensible shoes",siren:"Siren song",pass:"Hard pass"};
// Workflow status. Past "Needs contact", a deal graduates to the Deal Room, which owns its later stages.
const STATUS={added:"Just added",fill:"Needs Claude fill-out",judgment:"Needs judgment calls",hold:"Hold for later",household:"Needs household review",nointerest:"No further interest",contact:"Needs contact with owner/broker",graduated:"In Deal Room",dnp:"Do not proceed",delisted:"Delisted"};
const CLOSED=new Set(["nointerest","dnp","delisted","graduated"]);
const statusOf=d=>STATUS[d.status]?d.status:"added";
const PRIME_STALE_DAYS=60;
const LS_KEY="acq-scorecard-v1";

const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
function deepMerge(base,over){
  const o=clone(base)||{};if(!isObj(over))return o;
  for(const k in over){const v=over[k];if(isObj(v)&&isObj(o[k]))o[k]=deepMerge(o[k],v);else if(v!==undefined)o[k]=clone(v);}
  return o;
}
// Resolve the stored profile against the example (for any missing field) and the criteria library.
function resolveProfile(raw){
  const p=deepMerge(EXAMPLE,raw||{});
  p.configured=!!(raw&&raw.configured);
  p.crit=(p.criteria||[]).map(e=>{
    const base=LIBC[e.id]||{};
    const c=Object.assign({},base,e);
    c.kind=CALC_IDS.includes(c.id)?"calc":"judgment";
    c.name=c.name||c.id;
    c.anchors=Object.assign({},base.anchors||{},e.anchors||{});
    const w=e.weight||{};c.weight={up:Number(w.up)||0,down:Number(w.down)||0};
    return c;
  });
  p.critById={};for(const c of p.crit)p.critById[c.id]=c;
  p.manualGates=(p.gates.manual||[]).filter(g=>g&&g.id&&(g.tier==="hard"||g.tier==="soft"));
  return p;
}
let rawProfile=null;          // what's stored (config/profile or browser storage); null = example
let P=resolveProfile(null);   // resolved profile the engine reads
const on=id=>!!P.critById[id];
const V=(snark,plain)=>P.voice==="plain"?plain:snark;

/* ---------- state ---------- */
let db=null, sample=null, downloads=null, canWrite=true, localMode=false;
let deals={};            // id -> deal
let multiples=[];
let view={name:"pipe",id:null};
let showAll=false;
let mapOpen=true;          // per-viewer, browser storage
try{mapOpen=localStorage.getItem("mapOpen")!=="0";}catch(e){}
let statusFilter="active"; // per-viewer, browser storage
try{const v=localStorage.getItem("statusFilter");if(v&&(v==="active"||STATUS[v]))statusFilter=v;}catch(e){}
let cur=null;            // deal being edited (local copy)
let saveTimers={}, writing={}, dirty={};
let profileTimer=null;
let cheatBack=null;      // deal id to return to from the cheat sheet
let cheatSde=null;       // "try an SDE" value on the cheat sheet

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==="class")n.className=v;
    else if(k==="text")n.textContent=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    else if(k==="style")n.setAttribute("style",v);
    else n.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c.nodeType?c:document.createTextNode(String(c)));}
  return n;
}
const isNum=v=>typeof v==="number"&&isFinite(v);
function parseMoney(s){
  if(s==null)return null;s=String(s).trim().toLowerCase().replace(/[$,\s]/g,"");
  if(!s)return null;let m=1;
  if(s.endsWith("k")){m=1e3;s=s.slice(0,-1);}else if(s.endsWith("m")){m=1e6;s=s.slice(0,-1);}
  const v=parseFloat(s);return isFinite(v)?Math.round(v*m):null;
}
function parseN(s){if(s==null||String(s).trim()==="")return null;const v=parseFloat(String(s).replace(/[,%x×\s]/gi,""));return isFinite(v)?v:null;}
function money(v){if(!isNum(v))return "—";const a=Math.abs(v),sg=v<0?"−":"";
  if(a>=1e6)return sg+"$"+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M";
  if(a>=1e3)return sg+"$"+Math.round(a/1e3)+"K";return sg+"$"+Math.round(a);}
function moneyIn(v){return isNum(v)?String(v):"";}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pmt(P0,r,n){if(!(P0>0))return 0;if(!r)return P0/n;return P0*r/(1-Math.pow(1+r,-n));}
function today(){return new Date().toISOString().slice(0,10);}
function short(name,n){name=name||"Untitled";return name.length>n?name.slice(0,n-1)+"…":name;}
const pct=v=>v.toFixed(2).replace(/\.?0+$/,"")+"%";
const band=(v,bands)=>{for(const [t,s] of bands)if(v>=t)return s;return 1;};
const listJoin=a=>a.join(", ").replace(/, ([^,]*)$/," and $1");

/* ---------- rates ---------- */
// SBA 7(a) variable-rate caps: prime + the maximum spread for the loan size. Rough assumptions; the profile says when they were checked.
const tiers=()=>(P.rates.sbaTiers||[]).map(t=>[t.upTo==null?Infinity:Number(t.upTo),Number(t.spread)||0]);
function tierIndex(loan){const T=tiers();for(let i=0;i<T.length;i++)if(loan<=T[i][0])return i;return T.length-1;}
const rateFor=loan=>{const T=tiers();return T.length?(P.rates.prime+T[tierIndex(loan)][1])/100:P.rates.prime/100;};
function tierLabel(loan){const T=tiers(),i=tierIndex(loan),lo=i?T[i-1][0]:0,hi=T[i][0];
  return hi===Infinity?"over "+money(lo):lo?money(lo)+"–"+money(hi):"up to "+money(hi);}
// Largest loan whose yearly payment fits within ds. Not monotonic across tiers: a bigger loan can carry a lower rate.
function maxLoanFor(ds){let best=0,lo=0;const M=P.money;for(const [hi,sp] of tiers()){const L=Math.min(hi,ds/pmt(1,(P.rates.prime+sp)/100,M.loanTermYears));if(L>lo&&L>best)best=L;lo=hi;}return best;}
function primeAgeDays(){const t=Date.parse(P.rates.primeCheckedOn||"");return isFinite(t)?Math.floor((Date.now()-t)/864e5):null;}

/* ---------- deals ---------- */
function blankDeal(){return{
  name:"",industry:"",location:"",link:"",listingText:"",status:"added",dateAdded:today(),
  gates:{declineOverride:false},turnaround:false,just:{},
  fin:{price:null,revenue:null,sde:null,ebitda:null,inventoryExtra:null,realEstate:null,ffe:null,marginGuess:null,industryMultiple:null,rent:null},
  scores:{},why:{},
  track:{years:null,trend:"unknown"},commute:{minutes:null,presence:"auto"},
  premises:{dependence:"high",lease:"unknown",landLease:false},
  joy:{standalone:null,plan:null,planTag:""},perks:[],trust:{fins:false,reason:false},
  golden:{claims:false,checks:{}},notes:"",evalNotes:"",review:null
};}
function normalize(d){const b=blankDeal();const o=Object.assign(blankDeal(),d||{});
  for(const k of ["gates","fin","scores","track","commute","premises","joy","trust","golden"])o[k]=Object.assign({},b[k],(d||{})[k]||{});
  o.just=Object.assign({},(d||{}).just||{});o.why=Object.assign({},(d||{}).why||{});o.perks=Array.isArray(o.perks)?o.perks.slice():[];
  o.golden.checks=Object.assign({},o.golden.checks||{});return o;}

/* ---------- gates ---------- */
function gateInfo(id){
  if(id==="declining")return {label:"Declining revenue (hard gate overruled)",q:BUILTIN.declining.brokerQ||""};
  if(BUILTIN[id])return {label:BUILTIN[id].label,q:BUILTIN[id].brokerQ||"",explain:BUILTIN[id].explain||""};
  const g=(P.gates.manual||[]).find(x=>x.id===id);
  return g?{label:g.label,q:g.brokerQ||"",explain:g.explain||""}:{label:id,q:""};
}
// A built-in gate goes wherever the profile puts it: hard, soft, or off.
function builtinGate(r,id,hardText){
  const cfg=(P.gates.builtin||{})[id]||{};if(cfg.enabled===false)return;
  if((cfg.tier||(BUILTIN[id]||{}).tier)==="hard")r.hard.push({k:id,t:hardText});else r.soft.push(id);
}

/* ---------- scoring engine ---------- */
function calc(d){
  const f=d.fin, M=P.money, r={sc:{},unknown:[],soft:[],hard:[],flags:[],notes:{}};
  const unknown=(k,crit)=>{if(!crit||on(crit))r.unknown.push(k);};
  // earnings
  let sde=null,kind=null;
  if(isNum(f.sde)){sde=f.sde;kind="given";}
  else if(isNum(f.ebitda)){sde=f.ebitda+M.operatorSalary;kind="estimated";}
  else if(isNum(f.revenue)&&isNum(f.marginGuess)){sde=f.revenue*f.marginGuess/100;kind="guess";}
  r.sde=sde;r.sdeKind=kind;
  const inv=isNum(f.inventoryExtra)?f.inventoryExtra:0, re=isNum(f.realEstate)?f.realEstate:0;
  if(isNum(f.price)){
    r.eff=f.price+inv;r.total=r.eff*M.projectFactor;
    const share=r.eff>0?clamp(re/r.eff,0,1):0;
    r.financing=f.financing||"sba";r.note=0;r.noteDs=0;
    if(r.financing==="seller"&&isNum(f.sellerPct)&&f.sellerPct>0){
      // The note replaces bank debt, not your cash: use only what the cash down doesn't cover.
      r.noteOffered=r.eff*clamp(f.sellerPct,0,100)/100;r.note=Math.min(r.noteOffered,Math.max(0,r.total-M.cashDown));
      r.noteRate=isNum(f.sellerRate)?f.sellerRate:0;r.noteYears=isNum(f.sellerYears)&&f.sellerYears>0?f.sellerYears:M.loanTermYears;
      r.noteDs=pmt(r.note,r.noteRate/100,r.noteYears);
    }
    if(r.financing==="cash"){r.loan=0;r.shortfall=Math.max(0,r.total-M.cashDown);}
    else r.loan=Math.max(0,r.total-M.cashDown-r.note);
    r.tinyLoan=r.loan>0&&r.loan<M.tinyLoan;
    const rate=rateFor(r.loan);r.rate=rate*100;
    r.ds=pmt(r.loan*(1-share),rate,M.loanTermYears)+pmt(r.loan*share,rate,M.realEstateTermYears)+r.noteDs;
    if(r.total>M.projectCap)builtinGate(r,"cap","Total project "+money(r.total)+" is over your "+money(M.projectCap)+" cap");
    if(sde!=null){r.dscr=r.ds>0?(sde-M.operatorSalary)/r.ds:(sde>M.operatorSalary?99:0);r.take=sde-r.ds;r.mult=sde>0?(r.eff-re)/sde:null;}
    // Home lien: when business assets don't cover an SBA loan, lenders generally take a lien on personal real estate for the gap.
    if(P.lien.enabled&&r.loan>0&&!r.tinyLoan){
      r.collateral=re*P.lien.reHaircut+(isNum(f.ffe)?f.ffe:0)*P.lien.ffeHaircut;
      r.lienGap=Math.max(0,r.loan-r.collateral);
      if(r.lienGap>0)r.flags.push({k:"lien",t:V("Your house may be co-signing: ","Home-lien gap: ")+"about "+money(r.lienGap)+" of the "+money(r.loan)+" loan isn't covered by business assets"+(isNum(f.ffe)?"":" (no equipment value entered)")+", so expect the lender to want a lien on your home for the gap. Rough SBA assumption; ask a lender."});
    }
  }
  // deal math
  if(r.shortfall>0){r.sc.dealMath=1;builtinGate(r,"cashOnly","Cash-only, and it costs "+money(r.total)+" against your "+money(M.cashDown));}
  else if(r.dscr!=null)r.sc.dealMath=Math.min(band(r.take,P.bands.takeHome),band(r.dscr,P.bands.dscr));
  else{r.sc.dealMath="?";unknown("dealMath","dealMath");}
  if(sde!=null&&sde<M.sdeFloor)builtinGate(r,"sdeFloor","SDE "+money(sde)+" is under your "+money(M.sdeFloor)+" floor");
  if(r.dscr!=null&&r.dscr<P.bands.dscrGate)builtinGate(r,"dscr","Loan coverage under "+P.bands.dscrGate+" at the asking price");
  if(r.mult&&isNum(f.industryMultiple)&&f.industryMultiple>0){
    const ratio=r.mult/f.industryMultiple;
    if(ratio>1.25)r.flags.push({k:"rich",t:"Priced rich: "+r.mult.toFixed(1)+"× SDE vs your "+f.industryMultiple+"× reference."});
    else if(ratio<0.85)r.flags.push({k:"lean",t:"Priced lean: "+r.mult.toFixed(1)+"× SDE vs "+f.industryMultiple+"×. "+V("Cheap for a reason? Find it.","Find out why.")});
  }
  if(isNum(f.rent)&&isNum(f.revenue)&&f.revenue>0){r.rentPct=f.rent/f.revenue*100;if(r.rentPct>M.rentFlagPct)r.flags.push({k:"rent",t:"Rent is "+r.rentPct.toFixed(1)+"% of revenue."+V(" The landlord is your silent partner.","")});}
  // judgment criteria
  for(const c of P.crit){if(c.kind!=="judgment")continue;const s=d.scores[c.id];if(s==null||s==="?"){r.sc[c.id]="?";r.unknown.push(c.id);}else r.sc[c.id]=s;}
  // track record: base score from years open, plus a bonus for clear growth
  const y=d.track.years,B=P.track.yearBands;
  if(isNum(y)){let b=y<B[0]?1:y<B[1]?2:y<B[2]?3:y<B[3]?4:5;r.trackBase=b;if(d.track.trend==="growing")b=Math.min(5,b+(P.track.growthBonus||0));r.sc.track=b;}
  else{r.sc.track="?";unknown("years","track");}
  if(d.track.trend==="unknown")unknown("trend","track");
  // Declining revenue: overrulable once the revenue is confirmed and the cause understood, which downgrades it to a soft gate.
  if(d.track.trend==="declining"){
    const cfg=(P.gates.builtin||{}).declining||{};
    if(cfg.enabled!==false){
      if(d.gates.declineOverride&&cfg.overrulable!==false)r.soft.push("declining");
      else builtinGate(r,"declining","Revenue is declining"+(cfg.overrulable!==false?" (overrule it under Track record once you've confirmed the revenue and know why)":""));
    }
  }
  // commute: score slides from 5 (close) to 1 (at the limit for how often you'd be there), plus a bonus for less frequent presence
  let pres=d.commute.presence;
  if(pres==="auto"){
    const t=d.scores.team;
    pres=(P.geo.presenceFromTeam&&on("team"))?((isNum(t)&&t>=4)?"weekly":(t===3?"few":"daily")):"daily";r.presAuto=true;
  }
  const lim=P.geo.presenceLimits, full=P.geo.fullScoreWithin;
  r.presence=pres;const max=lim[pres];r.maxMin=max;
  const m=d.commute.minutes;
  if(isNum(m)){
    let s=m<=full?5:(max>full?5-4*(m-full)/(max-full):1);s=clamp(s,1,5);
    s=Math.min(5,s+((P.geo.presenceBonus||{})[pres]||0));
    r.sc.commute=Math.round(s*10)/10;
    const tooFar="One-way drive of "+m+" min is past your limit";
    if(pres==="weekly"&&isNum(lim.weeklyStretch)&&lim.weeklyStretch>max){
      if(m>lim.weeklyStretch)builtinGate(r,"commute",tooFar);
      else if(m>max)r.flags.push({k:"stretch",t:"Weekly check-ins at "+m+" min is in your "+max+"–"+lim.weeklyStretch+" min stretch zone."});
    }else if(m>max)builtinGate(r,"commute",tooFar);
  }else{r.sc.commute="?";unknown("minutes","commute");}
  // premises: lease security x location dependence
  const Pm=d.premises;
  if(Pm.lease==="owned")r.sc.premises=5;
  else if(Pm.dependence==="low")r.sc.premises=(Pm.lease==="short"||Pm.lease==="unknown")?4:5;
  else r.sc.premises={long:5,mid:3,short:1}[Pm.lease]||"?";
  if(r.sc.premises==="?")unknown("premises","premises");
  if(Pm.landLease)builtinGate(r,"landLease","Land lease");
  if(d.turnaround)builtinGate(r,"turnaround","Turnaround with a non-operational problem");
  // gates ticked per deal
  for(const g of P.manualGates){if(!d.gates[g.id])continue;if(g.tier==="hard")r.hard.push({k:g.id,t:g.label});else r.soft.push(g.id);}
  r.soft=[...new Set(r.soft)];
  // fit = 50 + sum of (score - 3) / 2 x weight, upside weight above 3 and downside weight below
  let base=50;r.contrib={};
  for(const c of P.crit){const s=r.sc[c.id];const v=(s==="?"||s==null)?2:s;const x=(v-3)/2*(v>3?c.weight.up:c.weight.down);r.contrib[c.id]=x;base+=x;}
  r.base=base;
  const cap=P.perkCap;
  r.nudge=clamp(d.perks.filter(p=>!(r.note>0&&p.label==="Seller financing offered")).reduce((a,p)=>a+(Number(p.pts)||0),0),-cap,cap);
  r.penalty=M.softGatePenalty*r.soft.length;
  r.fit=Math.round(clamp(base+r.nudge-r.penalty,0,100));
  r.out=r.hard.length>0;
  // joy: the higher of standalone joy and plan joy minus the discount; it never raises fit
  const J=P.joy,js=d.joy.standalone,jp=d.joy.plan;
  r.joy=(isNum(js)||isNum(jp))?Math.max(isNum(js)?js:0,isNum(jp)?jp-J.planDiscount:0):null;
  r.joyFromPlan=isNum(jp)&&(jp-J.planDiscount)>(isNum(js)?js:0);
  if(r.joy!=null)r.quad=r.fit>=J.fitCut?(r.joy>=J.joyCut?"go":"shoes"):(r.joy>=J.joyCut?"siren":"pass");
  // trust: only what a listing can show. Multi-year financials and revenue trend are broker-stage questions.
  r.issues=[];
  if(isNum(f.sde)&&isNum(f.revenue)&&f.revenue>0){const mg=f.sde/f.revenue;r.margin=mg;if(mg>0.5)r.issues.push("SDE is "+Math.round(mg*100)+"% of revenue."+V(" Normal for consulting, a fairy tale for retail."," Plausible for consulting, unusual for retail."));}
  if(isNum(f.sde)&&isNum(f.ebitda)){const op=f.sde-f.ebitda;r.ownerPay=op;if(op<0)r.issues.push("EBITDA is higher than SDE."+V(" That's backwards."," It should be the other way round."));else if(op>250000)r.issues.push("SDE minus EBITDA implies "+money(op)+" of owner pay."+V(" Generous owner, or creative add-backs?"," Check the add-backs."));}
  r.unknownFirst=r.unknown.filter(k=>k!=="trend");
  const fails=(d.trust.reason?0:1)+(r.issues.length?1:0);
  r.trust=(r.unknownFirst.length>=3||fails>=2)?"Low":(fails===0&&r.unknownFirst.length<=1)?"High":"Medium";
  // golden ticket: claims truly absentee, nothing gated, strong deal math and track record
  r.golden=!!(d.golden.claims&&!r.out&&isNum(r.sc.dealMath)&&r.sc.dealMath>=4&&isNum(r.sc.track)&&r.sc.track>=4);
  return r;
}

function callouts(d,r){
  const out=[],J=P.joy,M=P.money;
  if(r.out)out.push(["bad","Out on a hard gate: "+r.hard.map(h=>h.t).join("; ")+"."+V(" Scored anyway, because you'll want to know what you're missing. You're not missing anything."," Scored anyway, for reference.")]);
  if(r.golden)out.push(["ok",V("Golden ticket candidate. Affordable, performing, and claims to run itself. Which is exactly what a padded listing would say. Work the checklist before you get attached.","Golden ticket candidate: affordable, performing, and claims to run without the owner. Verify every part of that with the checklist.")]);
  if(r.joy!=null&&r.joy>=J.sirenJoy&&r.fit<J.sirenFit)out.push(["warn",V("Siren song. Joy "+r.joy+" with Fit "+r.fit+". You're romanticizing this. Put the hot cocoa down and look at the numbers.","Siren song: Joy "+r.joy+" with Fit "+r.fit+". The appeal is outrunning the numbers.")]);
  if(r.joy!=null&&r.joy<=J.shoesJoy&&r.fit>=J.shoesFit)out.push(["warn",V("Sensible shoes. Great fit, zero spark. Who runs this in year 3, and do they enjoy it?","Sensible shoes: strong fit, little interest. Think about who runs it in year 3.")]);
  const H=P.household;
  if(H.enabled){
    const ids=(H.criteria||[]).filter(k=>on(k)&&P.critById[k].kind==="judgment");
    const phrase={team:V("you're the labor","you'd be the main labor"),ownerDep:V("the customers came for the old owner","customers are loyal to the owner"),transition:V("nobody's teaching you","little handover help")};
    const low=ids.filter(k=>isNum(d.scores[k])&&d.scores[k]<=H.lowAtOrBelow);
    if(low.length>=H.minLow&&!ids.some(k=>isNum(d.scores[k])&&d.scores[k]>=H.noneAtOrAbove)){
      const parts=low.map(k=>phrase[k]||P.critById[k].name.toLowerCase()+" is weak");
      out.push(["warn","Household check: "+listJoin(parts)+"."+V(" Did you and "+H.partnerLabel+" talk about this one?"," Worth talking through with "+H.partnerLabel+".")]);
    }
  }
  if(r.unknownFirst.length>=3)out.push(["warn",r.unknownFirst.length+" unknowns."+V(" These numbers are about 40% vibes. The broker questions below are your homework."," The broker questions below cover them.")]);
  for(const k of r.soft){if(!(d.just[k]||"").trim())out.push(["bad",gateInfo(k).label+V(" and no reason written down. Why are you still looking at this?",": write down why you're still looking.")]);}
  for(const c of P.crit){if(c.kind!=="judgment")continue;const s=d.scores[c.id];if((s===1||s===5)&&!(d.why[c.id]||"").trim())out.push(["warn",V("You gave "+c.name.toLowerCase()+" a "+s+" with no reason. Bold. Write one line of evidence.",c.name+" is a "+s+" with no evidence noted. Add one line.")]);}
  if(r.sdeKind==="estimated")out.push(["","SDE is estimated from EBITDA + "+money(M.operatorSalary)+". Close enough for a first look; get the real number."]);
  if(r.sdeKind==="guess")out.push(["warn",V("Deal math runs on your margin guess. Treat every number derived from it as fan fiction.","Deal math runs on your margin guess, so treat it as a rough estimate.")]);
  for(const f of r.flags)out.push([f.k==="lean"||f.k==="stretch"?"":"warn",f.t]);
  for(const i of r.issues)out.push(["bad",i]);
  if(r.joyFromPlan)out.push(["","Joy comes from the bigger plan ("+(d.joy.planTag||"untagged")+"), discounted "+J.planDiscount+". Deal #1 still has to stand on its own numbers."]);
  if(r.trust==="Low"&&r.unknownFirst.length<3)out.push(["warn","Low trust: the numbers don't add up and there's no believable reason for sale."+V(" Don't fall in love on unverified numbers.","")]);
  if(r.shortfall>0)out.push(["bad","Cash-only, and it costs "+money(r.total)+" all-in. You have "+money(M.cashDown)+"."+V(" Unless the seller takes financing or drops the price, this is a very expensive window-shopping trip."," It only works if the seller takes financing or drops the price.")]);
  if(!out.length)out.push(["ok",V("Nothing to yell about. Suspicious, honestly. Run 'Challenge me' anyway.","Nothing flagged.")]);
  return out;
}

const BQ_EXTRA={years:"What year was the business founded?",trend:"Revenue and SDE for each of the last 3 years?",minutes:"Where exactly is the business located?"};
function brokerQs(d,r){
  const q=[];
  for(const k of r.unknown){const t=BQ_EXTRA[k]||(P.critById[k]&&P.critById[k].brokerQ);if(t)q.push(t);}
  for(const k of r.soft){const t=gateInfo(k).q;if(t)q.push(t);}
  if(!d.trust.fins)q.push("Can you share P&Ls and tax returns for the last 3 years?");
  if(!d.trust.reason)q.push("Why is the owner selling, and why now?");
  if(r.issues.length)q.push("Help me reconcile the numbers: what's in the add-backs, and what does the owner pay themselves?");
  if(r.sdeKind==="estimated")q.push("What is the owner's total compensation and benefits, so I can confirm SDE?");
  if(r.flags.some(f=>f.k==="rich"))q.push("How was the asking price arrived at?");
  if(r.flags.some(f=>f.k==="lien"))q.push("What equipment, vehicles and receivables come with the business, and roughly what are they worth?");
  if(d.golden.claims)q.push("Absentee claim: owner's actual weekly hours, manager tenure, payroll records?");
  return [...new Set(q)];
}

/* ---------- persistence ---------- */
// Two backends: the artifact database (on claude.ai) or this browser's storage (local file, or no database).
function setBanner(t){const b=$("#banner");b.textContent="";if(t)b.append(el("div",{class:"banner warn",text:t}));}
function saveLocal(){
  if(!localMode)return false;
  try{localStorage.setItem(LS_KEY,JSON.stringify({profile:rawProfile,deals,multiples,savedAt:new Date().toISOString()}));return true;}
  catch(e){setSaved("Couldn't save in this browser (storage full or blocked). Export a backup from Settings.");return false;}
}
function loadLocal(){
  try{const s=localStorage.getItem(LS_KEY);if(!s)return;const o=JSON.parse(s);
    rawProfile=o.profile||null;deals=o.deals||{};multiples=Array.isArray(o.multiples)?o.multiples:[];P=resolveProfile(rawProfile);}
  catch(e){}
}
function scheduleSave(d){
  if(!d||!d.id)return;deals[d.id]=d;
  clearTimeout(saveTimers[d.id]);
  setSaved("Saving…");
  saveTimers[d.id]=setTimeout(()=>flush(d.id),650);
}
async function flush(id){
  delete saveTimers[id];
  if(localMode){const d=deals[id];if(d)d.updatedAt=new Date().toISOString();if(saveLocal())setSaved("Saved in this browser");return;}
  if(!db||!canWrite){setSaved(db?"Read-only":"Not saved (no database here)");return;}
  if(writing[id]){dirty[id]=true;return;}
  writing[id]=true;
  const d=deals[id];if(!d){writing[id]=false;return;}
  const body=JSON.parse(JSON.stringify(d));delete body.id;body.updatedAt=new Date().toISOString();
  try{await db.collection("deals").doc(id).set(body);setSaved("Saved");}
  catch(e){
    if(e&&(e.code==="invalid_argument"||e.code==="permission_denied")){canWrite=false;setSaved("Read-only: you can't edit this one");}
    else if(e&&e.code==="quota_exceeded")setSaved("Storage full. Delete some passed deals.");
    else setSaved("Couldn't save. Will retry on your next edit.");
  }
  writing[id]=false;
  if(dirty[id]){dirty[id]=false;flush(id);}
}
function setSaved(t){const s=$("#saved");if(s)s.textContent=t;}
async function deleteDeal(id){
  delete deals[id];clearTimeout(saveTimers[id]);delete saveTimers[id];
  if(localMode)saveLocal();
  else if(db&&canWrite){try{await db.collection("deals").doc(id).delete();}catch(e){}}
}
// Profile edits: apply now, save shortly after. The page always saves the whole profile.
function setProfile(raw,immediate){
  rawProfile=raw;P=resolveProfile(rawProfile);
  clearTimeout(profileTimer);
  const save=async()=>{
    if(localMode){saveLocal();return;}
    if(!db||!canWrite)return;
    try{await db.doc("config/profile").set(Object.assign({},rawProfile,{updatedAt:new Date().toISOString()}));}catch(e){setBanner("Couldn't save your settings. Export them from Settings so they aren't lost.");}
  };
  if(immediate)return save();
  profileTimer=setTimeout(save,600);
}
// The editable copy of the profile: the stored one, or the example as a starting point.
function editableProfile(){return clone(rawProfile)||Object.assign(clone(EXAMPLE),{configured:false});}
async function saveMultiples(){if(localMode){saveLocal();return;}if(!db||!canWrite)return;try{await db.doc("config/multiples").set({rows:multiples});}catch(e){}}

/* ---------- export / import ---------- */
async function offerFile(filename,text,status){
  if(downloads){
    try{await downloads.save({filename,data:text});status.textContent="Saved "+filename+".";return;}
    catch(e){if(e&&e.code==="declined"){status.textContent="Download declined.";return;}}
  }
  try{
    const a=el("a",{href:URL.createObjectURL(new Blob([text],{type:"application/json"})),download:filename});
    document.body.append(a);a.click();a.remove();status.textContent="Downloaded "+filename+". If nothing appeared, copy the text below instead.";
  }catch(e){status.textContent="This view can't download files. Copy the text below instead.";}
}
function importText(text){
  let o;try{o=JSON.parse(text);}catch(e){return "That isn't valid JSON.";}
  const prof=o&&o.schema?o:(o&&o.profile&&o.profile.schema?o.profile:null);
  if(!prof)return "No config found (expected a file with \"schema\": 1, or a backup with a \"profile\").";
  if(prof.schema!==1)return "This config is schema "+prof.schema+"; this page reads schema 1.";
  if(!Array.isArray(prof.criteria)||!prof.criteria.length)return "This config has no criteria.";
  const nDeals=o.deals&&isObj(o.deals)?Object.keys(o.deals).length:0;
  setProfile(Object.assign({},prof,{configured:true}),true);
  if(nDeals){
    for(const id in o.deals){const d=normalize(o.deals[id]);d.id=id;deals[id]=d;if(!localMode)flush(id);}
    if(localMode)saveLocal();
    if(Array.isArray(o.multiples)){multiples=o.multiples;saveMultiples();}
  }
  return "Imported the config"+(nDeals?" and "+nDeals+" deal"+(nDeals>1?"s":""):"")+".";
}

/* ---------- views ---------- */
function go(name,id){
  if(view.name==="deal"&&cur&&saveTimers[cur.id]){clearTimeout(saveTimers[cur.id]);flush(cur.id);}
  if(name==="cheat")cheatBack=view.name==="deal"&&cur?cur.id:(view.name==="cheat"?cheatBack:null);
  view={name,id:id||null};
  if(name==="deal"){cur=id&&deals[id]?normalize(JSON.parse(JSON.stringify(deals[id]))):null;if(cur)cur.id=id;}
  render();
  window.scrollTo({top:0});
}
function render(){
  const v=$("#view");v.textContent="";
  $("#nav-pipe").classList.toggle("on",view.name==="pipe");
  $("#nav-cheat").classList.toggle("on",view.name==="cheat");
  $("#nav-settings").classList.toggle("on",view.name==="settings");
  $("#nav-setup").classList.toggle("on",view.name==="setup");
  if(view.name==="settings")v.append(renderSettings());
  else if(view.name==="setup")v.append(renderSetup());
  else if(view.name==="cheat")v.append(renderCheat());
  else if(view.name==="deal"&&cur)v.append(renderEditor());
  else v.append(renderPipeline());
}
function noticeCards(){
  const out=[];
  if(!P.configured)out.push(el("div",{class:"banner warn"},"You're looking at the fictional example searcher's settings. Run Setup (or import your config in Settings) before scoring real deals. ",el("button",{type:"button",class:"small",onclick:()=>go("setup"),text:"Run Setup"})));
  const age=primeAgeDays();

  return out;
}

/* challenge me */
let challengeCtl=null;
function renderChallenge(d,r){
  const card=el("div",{class:"card",style:"display:flex;flex-direction:column;gap:8px"});
  card.append(el("div",{class:"sec-head"},el("h2",{text:"Challenge me"}),el("span",{class:"small muted",text:"Claude reads the listing and your scores"})));
  const out=el("div",{class:"review",id:"review-out"});
  if(d.review&&d.review.text){out.textContent=d.review.text;}
  else{out.textContent=sample?"Claude compares your scores with the listing text and calls out anything you're glossing over.":"Needs the page open on claude.ai (it uses your own Claude usage). Not available in local mode.";out.classList.add("muted");}
  const btn=el("button",{type:"button",class:"primary",text:d.review?"Challenge me again":"Challenge me",disabled:!sample});
  const stop=el("button",{type:"button",text:"Stop",hidden:true});
  stop.addEventListener("click",()=>challengeCtl&&challengeCtl.abort());
  btn.addEventListener("click",async()=>{
    if(!sample)return;
    challengeCtl=new AbortController();btn.disabled=true;stop.hidden=false;out.classList.remove("muted");out.textContent="Thinking…";
    try{
      const {text}=await sample(buildPrompt(d,calc(d)),{signal:challengeCtl.signal,cache:false,onText:({text})=>{out.textContent=text;}});
      d.review={text,at:new Date().toISOString()};scheduleSave(d);
      if(cur===d)setTimeout(refreshSide,0);
    }catch(e){
      const code=e&&e.code;
      if(code==="cancelled"){out.textContent=(e.text||"")+(e.text?"\n\n(stopped)":"Stopped.");}
      else if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"){out.textContent="Claude access wasn't allowed for this page.";btn.hidden=true;}
      else if(code==="rate_limited")out.textContent="Rate limited. Give it a few minutes.";
      else if(code==="refused")out.textContent="Claude declined that one. Try trimming the listing text.";
      else out.textContent=(e&&e.text?e.text+"\n\n":"")+"Something went wrong reaching Claude. Try again.";
    }finally{btn.disabled=false;stop.hidden=true;btn.textContent="Challenge me again";}
  });
  card.append(el("div",{class:"row-actions"},btn,stop),out);
  if(d.review&&d.review.at)card.append(el("div",{class:"small muted",text:"Last run "+new Date(d.review.at).toLocaleString()}));
  return card;
}

  const dcfg=(P.gates.builtin||{}).declining||{};
  if(dcfg.enabled!==false)hard.push("visibly declining revenue"+(dcfg.overrulable!==false?" (overrulable later, once revenue is confirmed and the cause understood; it then counts as a soft gate)":""));
  const soft=["SDE under "+money(M.sdeFloor),"loan coverage (DSCR) under "+P.bands.dscrGate+" at asking","land lease","past their commute limit","non-operational turnaround","cash-only deal costing more than their cash"].concat(P.manualGates.filter(g=>g.tier==="soft").map(g=>g.label.toLowerCase()));
  const lines=[
"You are reviewing a searcher's first-look score of a small business for sale. They want to be called out: be direct and dry"+(P.voice==="plain"?"":", a little snarky")+", never flattering. Stay substantively correct and useful.",
"",
"WHAT THIS STAGE IS (read carefully; it changes how you judge): this is the FIRST LOOK at a public listing, before any NDA, financials or seller conversation. Listings routinely hide SDE/EBITDA, trends and lease details, so missing numbers are normal here and are NOT a reason to rule a deal out; they become questions for the broker. Every listing claim will be verified later in due diligence, so do not tell them to 'verify the financials' or 'get the P&L' as if that were news. The one question this stage answers: IF the listing is telling the truth, is this worth digging into to confirm? Or is it already too sketchy (claims that contradict each other or don't add up even on their own terms) or too uninteresting/poor a fit even in the best case? Treat a deal as sketchy only on internal contradictions or implausible claims, not on missing information.",

H.enabled?"HOUSEHOLD: "+H.partnerLabel+" weighs handover risk heavily ("+(H.criteria||[]).filter(on).map(k=>P.critById[k].name.toLowerCase()).join(", ")+"). Flag it when a deal is weak on those.":"",

"Calculated: SDE used "+money(r.sde)+(r.sdeKind?" ("+r.sdeKind+")":"")+", total project "+money(r.total)+", payments/yr "+money(r.ds)+", DSCR "+(r.tinyLoan?"n/a (the bank loan is only "+money(r.loan)+", so this is effectively a cash deal; a huge DSCR here is expected math, not an error)":r.dscr!=null?(r.dscr>=99?"n/a (no debt)":r.dscr.toFixed(2)):"?")+", their take-home "+money(r.take)+", multiple "+(r.mult?r.mult.toFixed(2)+"x":"?")+".",

function wizCrit(e){const base=LIBC[e.id]||{};return Object.assign({kind:CALC_IDS.includes(e.id)?"calc":"judgment"},base,e,{anchors:Object.assign({},base.anchors||{},e.anchors||{})});}
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"item";
const uniqId=(prefix,base,taken)=>{let id=prefix+slug(base),k=2;while(taken.includes(id))id=prefix+slug(base)+"-"+(k++);return id;};

/* the two-round quiz (same method and math as the original priorities quiz) */
// Round A: both criteria at their best (anchor 5): which would you rather have? Round B: both at their worst still acceptable
// (anchor 1): which would you rather live with, with a dealbreaker option. Each round becomes a pairwise ratio matrix; weights
// are its row geometric means (AHP-style). Round B is inverted: preferring to live with A's worst means B's downside matters more.
const QUIZ_RATIO={"-2":5,"-1":2,"0":1,"1":0.5,"2":0.2};
function quizNew(ids){
  const n=ids.length,mk=()=>{let p=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)p.push(Math.random()<.5?[i,j]:[j,i]);
    for(let k=p.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[p[k],p[r]]=[p[r],p[k]];}
    // avoid showing the same criterion in two pairs in a row where possible
    for(let k=1;k<p.length;k++){const a=p[k-1],q=p[k];if(a.includes(q[0])||a.includes(q[1])){for(let m=k+1;m<p.length;m++){const s=p[m];if(!a.includes(s[0])&&!a.includes(s[1])){[p[k],p[m]]=[p[m],p[k]];break;}}}}
    return p;};
  return {ids:ids.slice(),P:[mk(),mk()],A:[[],[]],DB:[[],[]],rd:0,idx:0,result:null};
}
function quizWeights(q,r,inv){
  const n=q.ids.length;
  const M=Array.from({length:n},()=>Array(n).fill(1)),D=Array.from({length:n},()=>Array(n).fill(0));

      el("div",{class:"opt"},el("div",{class:"eyebrow",text:"Right"}),el("div",{class:"crit-name",text:cb.name}),el("div",{class:"small",text:get(cb)}))));
    s.append(el("div",{class:"choices"},...[["-2","Left, by a lot"],["-1","Left"],["0","Toss-up"],["1","Right"],["2","Right, by a lot"]].map(([v,t])=>el("button",{type:"button",onclick:()=>quizPick(+v),text:t}))));

    s.append(el("div",{class:"row-actions",style:"justify-content:space-between"},el("span",{class:"small muted",text:q.quip||"Keys 1–5 work too."}),el("button",{type:"button",class:"ghost",onclick:quizBack,text:"← Back"})));

  }else{
    const res=q.result,s=wsec("Your weights","From the quiz. Each column sums to 100.");

    s.append(el("div",{class:"tablewrap"},el("table",{},
      el("thead",{},el("tr",{},el("th",{text:"Criterion"}),el("th",{class:"n",text:"Upside"}),el("th",{class:"n",text:"Downside"}),el("th",{class:"n",text:"Combined %"}),el("th",{class:"n",text:"Dealbreaker"}))),
      el("tbody",{},...rows.map(r=>el("tr",{},el("td",{text:names[r.id].name}),el("td",{class:"n",text:String(r.up)}),el("td",{class:"n",text:String(r.down)}),el("td",{class:"n",text:r.combinedPct.toFixed(1)}),el("td",{class:"n",text:r.dealbreakers?"×"+r.dealbreakers:"—"})))))));
    const notes=[];
    notes.push("Circular answers (A over B over C over A): "+res.loops.A+" in round A, "+res.loops.B+" in round B. A few are normal; lots means you were tired or indifferent.");
    notes.push("Toss-ups: "+res.tossups.A+" in round A, "+res.tossups.B+" in round B.");
    const lop=res.rows.filter(r=>Math.abs(r.up-r.down)>=8);
    if(lop.length)notes.push("Lopsided: "+lop.map(r=>names[r.id].name+" ("+r.up+" up / "+r.down+" down: matters mostly when it's "+(r.up>r.down?"good":"bad")+")").join(", ")+". Two-sided scoring uses that.");
    const dbk=res.rows.filter(r=>r.dealbreakers>=Math.max(2,Math.ceil((n-1)/3)));
    s.append(el("ul",{class:"qlist small"},...notes.map(t=>el("li",{text:t}))));
    if(dbk.length)s.append(el("div",{class:"banner warn",style:"margin:0"},"Gate candidates: "+dbk.map(r=>names[r.id].name+" (dealbreaker ×"+r.dealbreakers+")").join(", ")+". If the worst version is a walk-away, the anchor isn't 'worst still acceptable'. Either move that part into a gate, or rewrite the 1 anchor to something you'd accept, then retake round B. Otherwise the weight is inflated by a deal you'd never take."));
    const retakeB=el("button",{type:"button",text:"Retake round B only"});
    retakeB.addEventListener("click",()=>{q.A[1]=[];q.DB[1]=[];q.rd=1;q.idx=0;q.result=null;wizRefresh();});
    const retake=el("button",{type:"button",text:"Retake the whole quiz"});
    retake.addEventListener("click",()=>{wiz.quiz=quizNew(ids);wizRefresh();});

  const paintSums=()=>{const u=p.criteria.reduce((a,c)=>a+(Number(c.weight&&c.weight.up)||0),0),d=p.criteria.reduce((a,c)=>a+(Number(c.weight&&c.weight.down)||0),0);
    sums.textContent="Upside sums to "+u+", downside to "+d+(u===100&&d===100?". Good.":". Each should be 100.");sums.className="small "+(u===100&&d===100?"muted":"");};

  m.append(el("div",{class:"tablewrap"},el("table",{},el("thead",{},el("tr",{},el("th",{text:"Criterion"}),el("th",{text:"Upside"}),el("th",{text:"Downside"}))),tb)),sums,el("div",{class:"row-actions"},norm));
  paintSums();
  wrap.append(m);
  return wrap;
}

function setupFinish(){
  const p=wiz.profile,issues=[],ok=[];
  const crit=p.criteria.map(wizCrit);
  const u=p.criteria.reduce((a,c)=>a+(Number(c.weight&&c.weight.up)||0),0),d=p.criteria.reduce((a,c)=>a+(Number(c.weight&&c.weight.down)||0),0);
  if(!crit.length)issues.push("No criteria.");
  if(u!==100||d!==100)issues.push("Weights sum to "+u+" (upside) and "+d+" (downside); each should be 100. Take the quiz or fix them by hand.");
  const noAnch=crit.filter(c=>c.kind==="judgment"&&(!c.anchors[1]||!c.anchors[3]||!c.anchors[5]));
  if(noAnch.length)issues.push("Missing a 1, 3 or 5 anchor: "+noAnch.map(c=>c.name).join(", ")+".");
  for(const [k,l] of [["cashDown","cash"],["projectCap","project cap"],["operatorSalary","salary"],["projectFactor","project factor"]])if(!(p.money[k]>0))issues.push("Money: "+l+" isn't set.");
  if((p.gates.manual||[]).some(g=>!String(g.label||"").trim()))issues.push("A gate has no label.");
  const rg=(p.gates.manual||[]).find(g=>g.id==="region");if(rg&&!String(rg.text||"").trim())issues.push("The region gate has no region.");
  if(!(J=>[1,2,3,4,5].every(k=>String(J.anchors[k]||"").trim()))(p.joy))issues.push("Some Joy anchors are empty.");
  if(!p.quiz||!p.quiz.takenAt)ok.push("You set weights without the quiz. That works; the quiz is still there if you want it.");
  const age=Date.parse(p.rates.primeCheckedOn||"");if(!isFinite(age)||Date.now()-age>PRIME_STALE_DAYS*864e5)issues.push("The prime rate hasn't been checked in the last "+PRIME_STALE_DAYS+" days.");
  const s=wsec("Review and save");
  const hardN=(p.gates.manual||[]).filter(g=>g.tier==="hard").length+Object.values(p.gates.builtin||{}).filter(g=>g.enabled!==false&&g.tier==="hard").length;
  s.append(el("ul",{class:"qlist small"},
    el("li",{text:"Money: "+money(p.money.cashDown)+" in, up to "+money(p.money.projectCap)+" total, "+money(p.money.operatorSalary)+" salary, SDE floor "+money(p.money.sdeFloor)+"."}),
    el("li",{text:"Gates: "+hardN+" hard, "+((p.gates.manual||[]).filter(g=>g.tier==="soft").length+Object.values(p.gates.builtin||{}).filter(g=>g.enabled!==false&&g.tier==="soft").length)+" soft, "+(p.gates.manual||[]).filter(g=>g.tier==="digest-only").length+" digest-only."}),
    el("li",{text:"Criteria: "+crit.map(c=>c.name+" "+(c.weight?c.weight.up+"/"+c.weight.down:"")).join(" · ")}),
    el("li",{text:"Region: "+(p.geo.regionLimit||"(none)")+". Drive limits: daily "+p.geo.presenceLimits.daily+", a few days "+p.geo.presenceLimits.few+", weekly "+p.geo.presenceLimits.weekly+" min."})));
  if(issues.length)s.append(el("div",{class:"banner warn",style:"margin:0"},el("div",{style:"font-weight:600",text:"Fix before saving:"}),el("ul",{class:"qlist"},...issues.map(t=>el("li",{text:t})))));
  if(ok.length)s.append(el("ul",{class:"qlist small muted"},...ok.map(t=>el("li",{text:t}))));
  const status=el("div",{class:"small muted",role:"status"});
  const save=el("button",{type:"button",class:"primary",text:"Save to my Scorecard",disabled:issues.length>0||(!localMode&&!canWrite)});
  save.addEventListener("click",async()=>{
    const prof=Object.assign(clone(p),{schema:1,configured:true,updatedAt:new Date().toISOString()});
    await setProfile(prof,true);
    try{localStorage.removeItem(SETUP_KEY);}catch(e){}
    wiz=null;status.textContent="Saved.";go("pipe");
  });
  const exp=el("button",{type:"button",text:"Export this config"});
  exp.addEventListener("click",()=>offerFile("acq-config.json",JSON.stringify(Object.assign(clone(p),{schema:1,configured:true,exportedAt:new Date().toISOString()}),null,2),status));
  s.append(el("div",{class:"row-actions"},save,exp),status);
  if(!localMode&&!canWrite)s.append(el("div",{class:"small muted",text:"You can view this Scorecard but not change it. Export the config instead."}));
  s.append(el("div",{class:"small muted",text:"Saving replaces your Scorecard's settings. Deals you've already scored keep their scores and recalculate with the new weights. Keep an exported copy somewhere private: it's the backup."}));
  return s;
}

// Lets Claude run the scoring engine on a deal (e.g. the Fit snapshot taken when a deal graduates to the Deal Room).
// testProfile() swaps in a profile for this page view only; it is never saved.
window.ascEngine={
  calc:d=>calc(normalize(d)),
  profile:()=>clone(rawProfile)||clone(EXAMPLE),
  resolved:()=>clone({money:P.money,rates:P.rates,bands:P.bands,criteria:P.crit.map(c=>({id:c.id,kind:c.kind,weight:c.weight}))}),
  testProfile:raw=>{rawProfile=raw;P=resolveProfile(raw);render();return true;}
};

function startLocal(why){
  localMode=true;loadLocal();
  let ok=true;try{localStorage.setItem(LS_KEY+"-probe","1");localStorage.removeItem(LS_KEY+"-probe");}catch(e){ok=false;}
  setBanner(ok?why+" Deals are saved in this browser only, so export a backup from Settings now and then.":why+" This browser won't let the page save anything, so nothing you enter will be kept.");
  if(!ok)localMode=false;
  render();
}
render();
const C=window.claude;
if(!C||typeof C.use!=="function")startLocal("Local mode.");
else{
  C.use("sample").then(s=>{sample=s;if(view.name==="deal")refreshSide();}).catch(()=>{});
  C.use("downloads").then(x=>{downloads=x;}).catch(()=>{});
  C.use("user").then(async u=>{if(u&&typeof u.can==="function"){try{const w=await u.can("data.write");if(w===false)canWrite=false;}catch(e){}}}).catch(()=>{});
  C.use("db").then(d=>{
    if(!d){startLocal("No database in this view (signed out, or the page was published without one).");return;}
    db=d;setBanner("");
    db.collection("deals").onSnapshot(snap=>{
      const next={};
      for(const doc of snap.docs){next[doc.id]=doc.data();}
      if(cur&&saveTimers[cur.id]&&next[cur.id])next[cur.id]=deals[cur.id];
      deals=Object.assign({},next);
      if(cur&&deals[cur.id]===undefined&&view.name==="deal")deals[cur.id]=cur;
      if(view.name==="pipe")render();
    },()=>{setBanner("Lost the connection to your saved deals. Reload the page.");});
    db.doc("config/profile").onSnapshot(s=>{
      rawProfile=s.exists?s.data():null;P=resolveProfile(rawProfile);
      if(view.name==="deal")refreshSide();else if(view.name!=="settings"&&view.name!=="setup")render();
    },()=>{});
    db.doc("config/multiples").onSnapshot(s=>{if(s.exists){const rows=s.data().rows;multiples=Array.isArray(rows)?rows.map(x=>Object.assign({},x)):[];}},()=>{});
  }).catch(()=>startLocal("The database failed to load."));
}
